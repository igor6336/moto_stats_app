# Free Supabase projects pause after a week without requests (e.g. in
# winter). One cheap request every 3 days keeps the project awake.
name: supabase keepalive
on:
  schedule:
    - cron: '23 5 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase REST API
        run: |
          URL=$(sed -n "s/^export const SUPABASE_URL = '\(.*\)';/\1/p" src/config.js)
          KEY=$(sed -n "s/^export const SUPABASE_KEY = '\(.*\)';/\1/p" src/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase not configured"; exit 0; fi
          curl -fsS -o /dev/null -w "%{http_code}\n" "$URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $KEY"
