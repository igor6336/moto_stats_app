name: targeted push test
on:
  workflow_dispatch:
    inputs:
      login:
        description: 'MotoHrust login: sends one test to its latest subscription'
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned sender
        run: npm install --no-save --no-package-lock web-push@3.6.7
      - name: Send one targeted test
        env:
          PUSH_TEST_LOGIN: ${{ inputs.login }}
          PUSH_TEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/test-push.mjs
