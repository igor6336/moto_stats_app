<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0b0d10"/>
  <!-- gauge: centre (256, 286.7), r 174, from 150 deg to 390 deg; orange up to 300 deg -->
  <g fill="none" stroke-width="36">
    <path d="M 105.3 373.7 A 174 174 0 1 1 406.7 373.7" stroke="#2a313c"/>
    <path d="M 105.3 373.7 A 174 174 0 0 1 343 136.0" stroke="#ff7a1a"/>
  </g>
  <!-- sport bike, front view, no rider; leans 30 deg along the old needle.
       Drawn upright with the contact patch at the origin. -->
  <g transform="translate(240 352) rotate(30) scale(1.85)">
    <g fill="#eef1f5" stroke="#0b0d10" stroke-width="2" stroke-linejoin="round">
      <!-- mirrors -->
      <path d="M 21 -91 L 30 -95 Q 42 -97 46 -92 Q 45 -85 35 -85 L 23 -86 Z"/>
      <path d="M -21 -91 L -30 -95 Q -42 -97 -46 -92 Q -45 -85 -35 -85 L -23 -86 Z"/>
      <!-- levers -->
      <path d="M 24 -71 L 38 -62 L 36 -59 L 23 -67 Z"/>
      <path d="M -24 -71 L -38 -62 L -36 -59 L -23 -67 Z"/>
      <!-- lower fairing wrapping the wheel -->
      <path d="M -26 -68 Q -32 -44 -24 -27 Q -19 -18 -12 -13 L 12 -13 Q 19 -18 24 -27 Q 32 -44 26 -68 Z"/>
      <!-- upper fairing (nose) -->
      <path d="M 0 -103 Q 16 -103 22 -95 L 26 -80 L 23 -66 Q 12 -59 0 -57 Q -12 -59 -23 -66 L -26 -80 L -22 -95 Q -16 -103 0 -103 Z"/>
    </g>
    <g fill="#0b0d10">
      <!-- screen line -->
      <path d="M -22 -92 L 0 -87.5 L 22 -92 L 22 -89.6 L 0 -85 L -22 -89.6 Z"/>
      <!-- headlights -->
      <path d="M -21 -80 Q -12 -83 -5 -76 Q -7 -69.5 -12.5 -68.5 Q -19.5 -70.5 -21 -80 Z"/>
      <path d="M 21 -80 Q 12 -83 5 -76 Q 7 -69.5 12.5 -68.5 Q 19.5 -70.5 21 -80 Z"/>
      <!-- opening around the front wheel -->
      <path d="M -15 -13 L -17 -50 Q 0 -57 17 -50 L 15 -13 Z"/>
    </g>
    <!-- double side lines -->
    <g fill="none" stroke="#0b0d10" stroke-width="1.6" stroke-linecap="round">
      <path d="M -21.5 -60 Q -25 -36 -15.5 -16"/>
      <path d="M 21.5 -60 Q 25 -36 15.5 -16"/>
    </g>
    <g fill="#eef1f5" stroke="#0b0d10" stroke-width="1.6" stroke-linejoin="round">
      <!-- fork caps -->
      <rect x="-13" y="-51" width="5" height="7" rx="1.5"/>
      <rect x="8" y="-51" width="5" height="7" rx="1.5"/>
      <!-- tyre -->
      <rect x="-5.8" y="-47" width="11.6" height="48" rx="5"/>
      <!-- fender -->
      <path d="M -8.5 -52 Q 0 -56 8.5 -52 L 7.5 -44 L -7.5 -44 Z"/>
    </g>
  </g>
</svg>
