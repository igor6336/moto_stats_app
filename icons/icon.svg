<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0b0d10"/>
  <!-- gauge: centre (256, 286.7), r 174, from 150 deg to 390 deg; orange up to 300 deg -->
  <g fill="none" stroke-width="36">
    <path d="M 105.3 373.7 A 174 174 0 1 1 406.7 373.7" stroke="#2a313c"/>
    <path d="M 105.3 373.7 A 174 174 0 0 1 343 136.0" stroke="#ff7a1a"/>
  </g>
  <!-- sport bike, front view, no rider; leans 30 deg along the old needle.
       Drawn upright with the contact patch at the origin. -->
  <g transform="translate(240 352) rotate(30) scale(1.85)">
    <g fill="#eef1f5">
      <!-- mirrors -->
      <path d="M 22 -88 Q 31 -94 41 -93 Q 45 -89 42 -84 Q 32 -82 23 -83 Z"/>
      <path d="M -22 -88 Q -31 -94 -41 -93 Q -45 -89 -42 -84 Q -32 -82 -23 -83 Z"/>
      <!-- levers -->
      <path d="M 25 -70 L 37 -63 L 35.5 -60.5 L 24 -66.5 Z"/>
      <path d="M -25 -70 L -37 -63 L -35.5 -60.5 L -24 -66.5 Z"/>
      <!-- fairing -->
      <path d="M 0 -101 Q 16 -101 22 -93 L 26 -78 Q 30 -52 26 -32 Q 23 -22 16 -16 L -16 -16 Q -23 -22 -26 -32 Q -30 -52 -26 -78 L -22 -93 Q -16 -101 0 -101 Z"/>
    </g>
    <g fill="#0b0d10">
      <!-- screen line -->
      <path d="M -22 -90 L 0 -85.5 L 22 -90 L 22 -87.6 L 0 -83 L -22 -87.6 Z"/>
      <!-- headlights -->
      <path d="M -21.5 -75 Q -13 -79.5 -4 -73.5 L -7 -67 Q -15 -65 -21 -69.5 Z"/>
      <path d="M 21.5 -75 Q 13 -79.5 4 -73.5 L 7 -67 Q 15 -65 21 -69.5 Z"/>
      <!-- opening around the front wheel -->
      <path d="M -13.5 -16 L -15.5 -48 Q 0 -60 15.5 -48 L 13.5 -16 Z"/>
      <!-- side stripes -->
      <path d="M -24 -60 Q -24 -36 -17 -24 L -19 -23 Q -27 -36 -26.5 -60 Z"/>
      <path d="M 24 -60 Q 24 -36 17 -24 L 19 -23 Q 27 -36 26.5 -60 Z"/>
    </g>
    <g fill="#eef1f5">
      <!-- fork legs -->
      <rect x="-11.5" y="-48" width="3" height="28" rx="1.2"/>
      <rect x="8.5" y="-48" width="3" height="28" rx="1.2"/>
      <!-- fender -->
      <path d="M -7.5 -53 Q 0 -56.5 7.5 -53 L 7 -43 L -7 -43 Z"/>
      <!-- tyre -->
      <rect x="-5.5" y="-45" width="11" height="46" rx="5"/>
    </g>
    <path d="M -7.5 -42.6 L 7.5 -42.6" stroke="#0b0d10" stroke-width="1.6"/>
  </g>
</svg>
